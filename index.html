<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конвертер валют</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <section class="screen screen-main" id="screen-main">
      <h1 class="title">Конвертер валют</h1>

      <div class="currency-card" data-slot="top">
        <button class="currency-select" type="button" data-open="top">
          <span>
            <span class="currency-code" id="top-code">RUB</span>
            <span class="currency-name" id="top-name">Российский рубль</span>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="amount-box" type="button" id="top-amount" data-active-field="top">0₽</button>
      </div>

      <div class="currency-card" data-slot="bottom">
        <button class="currency-select" type="button" data-open="bottom">
          <span>
            <span class="currency-code" id="bottom-code">USD</span>
            <span class="currency-name" id="bottom-name">Доллар США</span>
          </span>
          <span class="chevron">›</span>
        </button>
        <button class="amount-box" type="button" id="bottom-amount" data-active-field="bottom">0$</button>
      </div>

      <div class="keypad" id="keypad">
        <button class="key key-wide key-action" type="button" data-action="ac">AC</button>
        <button class="key key-wide key-action" type="button" data-action="backspace" aria-label="Удалить">
          <svg width="28" height="20" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10.5 1H25C26.1 1 27 1.9 27 3V17C27 18.1 26.1 19 25 19H10.5C9.9 19 9.3 18.7 9 18.2L1.5 10.7C1 10.1 1 9.1 1.5 8.5L9 1.8C9.3 1.3 9.9 1 10.5 1Z" stroke="#22C55E" stroke-width="1.8" fill="none"/>
            <path d="M13 7L19 13M19 7L13 13" stroke="#22C55E" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>

        <button class="key" type="button" data-action="digit" data-value="7">7</button>
        <button class="key" type="button" data-action="digit" data-value="8">8</button>
        <button class="key" type="button" data-action="digit" data-value="9">9</button>

        <button class="key" type="button" data-action="digit" data-value="4">4</button>
        <button class="key" type="button" data-action="digit" data-value="5">5</button>
        <button class="key" type="button" data-action="digit" data-value="6">6</button>

        <button class="key" type="button" data-action="digit" data-value="1">1</button>
        <button class="key" type="button" data-action="digit" data-value="2">2</button>
        <button class="key" type="button" data-action="digit" data-value="3">3</button>

        <button class="key key-zero" type="button" data-action="digit" data-value="0">0</button>
        <button class="key" type="button" data-action="digit" data-value=",">,</button>
      </div>
    </section>

    <section class="screen screen-select hidden" id="screen-select">
      <header class="select-header">
        <button class="back-btn" type="button" id="back-btn" aria-label="Назад">←</button>
        <h1 class="title">Изменить валюту</h1>
      </header>

      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <circle cx="11" cy="11" r="7" stroke="#9CA3AF" stroke-width="2"/>
            <path d="M16.5 16.5L21 21" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </span>
        <input
          type="text"
          id="search-input"
          class="search-input"
          placeholder="Search currency..."
          autocomplete="off"
        >
        <button class="search-clear" type="button" id="search-clear" aria-label="Очистить">×</button>
      </div>

      <div class="currency-list" id="currency-list"></div>
    </section>
  </div>

  <script src="currencyData.js"></script>
  <script src="script.js"></script>
</body>
</html>
